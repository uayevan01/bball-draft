# fly.toml app configuration file generated for backend-falling-cloud-890 on 2026-01-30T00:06:42-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Periodic Basketball Reference refresh:
#   The web process stays lean; a separate scheduled Machine runs scripts/seed_refresh.sh.
#   One-time create (from backend/, after `fly auth login` + a successful deploy):
#     ./scripts/fly_seed_machine.sh create
#   After each deploy that changes scraper code:
#     ./scripts/fly_seed_machine.sh update
#

app = 'backend-falling-cloud-890'
primary_region = 'ewr'

[build]

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  processes = ['app']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
